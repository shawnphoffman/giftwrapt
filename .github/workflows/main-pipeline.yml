name: main pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Publish the current ref to GHCR with this semver tag (e.g. v0.6.0). Leave empty to skip docker-publish.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check drizzle journal invariants
        run: pnpm db:check

      - name: Check schema source matches committed migrations
        run: pnpm db:check-drift

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      # The only check that catches a missing `.storybook/mocks/api.ts`
      # export: `pnpm test`'s Storybook project uses Vite's lenient dev
      # transform (a missing name resolves to `undefined`), while the real
      # Rollup build fails the same way Vercel does. This exact gap shipped
      # the broken 0.44.0 deploy; gate main on it.
      - name: Build Storybook (strict mock-export guard)
        run: pnpm build-storybook

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=6144" pnpm build

      - name: Assert no source maps in client bundle
        run: |
          maps=$(find .output/public dist -name '*.map' 2>/dev/null || true)
          if [ -n "$maps" ]; then
            echo "::error::Source maps found in deployable output:"
            echo "$maps"
            exit 1
          fi
          echo "OK: no .map files in client bundle"

  release-please:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_TAG: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.PUBLISH_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.PUBLISH_TAG }}
            type=semver,pattern={{major}},value=${{ env.PUBLISH_TAG }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
