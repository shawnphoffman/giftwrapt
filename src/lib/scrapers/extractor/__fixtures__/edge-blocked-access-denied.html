<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Access Denied</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				background: #f5f5f5;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				text-align: center;
			}
			.container {
				background: white;
				padding: 3rem 2rem;
				border-radius: 12px;
				box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
				max-width: 480px;
				width: 90%;
			}
			.logo {
				width: 100%;
				max-width: 100%;
				height: auto;
				margin-bottom: 1.5rem;
			}
			h1 {
				font-size: 1.8rem;
				color: #1a1a1a;
				margin-bottom: 0.75rem;
				font-weight: 600;
			}
			p {
				font-size: 1rem;
				color: #555;
				line-height: 1.6;
				margin-bottom: 1.5rem;
			}
			.info {
				font-size: 0.85rem;
				color: #888;
				background: #fafafa;
				padding: 0.75rem 1rem;
				border-radius: 6px;
				display: inline-block;
				text-align: left;
			}
			.info code {
				font-family: monospace;
				background: #eee;
				padding: 0.15rem 0.3rem;
				border-radius: 4px;
				font-size: 0.85rem;
				word-break: break-all;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<img class="logo" src="data:image/png;base64,iVBORw0KGgo=" alt="Deckers Brands Logo" />
			<h1>Access Denied</h1>
			<p>
				Your request has been blocked.<br />
				Please contact the site administrator if you believe this is a mistake.
			</p>
			<div class="info">
				<div>Error reference: <code>BLOCKED_EDGE</code></div>
				<div>Client IP: <code>203.0.113.10</code></div>
				<div>Trace ID: <code>c4c662f0ec8e4a91a322000000000037</code></div>
				<div>Backend: <code>sfcc_hoka_na</code></div>
			</div>
		</div>
	</body>
</html>
