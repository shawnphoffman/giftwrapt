# =============================================================================
# Self-Hosted (RustFS backend, full (cron + scraper gateway))
# =============================================================================
# Includes the cron sidecar plus the scraper gateway (headless Chromium + gateway) for product pages the plain fetch cannot render. Set BROWSER_TOKEN in .env; the app seeds the provider entry on first boot. Budget about 1 GB of RAM for the headless engine. The MCP server is built into the app (enable it from Admin, General).
#
# Quick start:
#   1. cp .env.example docker/.env
#   2. Edit docker/.env - at minimum set POSTGRES_PASSWORD, BETTER_AUTH_SECRET,
#      and BETTER_AUTH_URL (the public URL you'll reach the app from).
#   3. Set STORAGE_ENDPOINT=http://rustfs:9000, STORAGE_REGION=us-east-1,
#      STORAGE_BUCKET=giftwrapt, plus any STORAGE_ACCESS_KEY_ID and
#      STORAGE_SECRET_ACCESS_KEY (RustFS accepts arbitrary strings).
#      STORAGE_FORCE_PATH_STYLE=true.
#   4. docker compose -f docker/compose.selfhost-rustfs-full.yaml up -d
#   5. Open BETTER_AUTH_URL in your browser and sign up.
#
# Generated by `pnpm generate:compose` from scripts/compose-registry/.
# Add or change features in scripts/compose-registry/features/<id>.ts.

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/shawnphoffman/giftwrapt:latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-giftwrapt}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      # Bundled scraper gateway (see the scraper service below). On first
      # boot the app seeds a "GiftWrapt Scraper" provider entry from this URL
      # and BROWSER_TOKEN; afterwards Admin > Scraping owns the entry.
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8080}
      # When the bundled RustFS sidecar is part of the stack, the app
      # entrypoint runs a bucket-create step (HeadBucket -> CreateBucket)
      # before DB migrations. Idempotent. Set to "false" (or omit) if
      # you're pointing STORAGE_* at an external S3-compatible bucket.
      INIT_RUSTFS: ${INIT_RUSTFS:-true}
    ports:
      - '${APP_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giftwrapt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-giftwrapt}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cron sidecar. Reads CRON_SECRET from the env file and curls the app's
  # /api/cron/* endpoints on a daily schedule (mirrors vercel.json). To
  # change schedules, edit ./cron-entrypoint.sh and recreate the service.
  # Higher cadences are safe: per-user advisory locks de-duplicate work.
  cron:
    image: alpine:3.20
    env_file: .env
    environment:
      CRON_APP_URL: ${CRON_APP_URL:-http://app:3001}
      TZ: ${TZ:-UTC}
    volumes:
      - ./cron-entrypoint.sh:/cron-entrypoint.sh:ro
    command: ['sh', '/cron-entrypoint.sh']
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Headless Chromium engine. Drives the scraper gateway; not reached directly
  # by the app. Set BROWSER_TOKEN in .env to a long random string; the gateway
  # service below shares it. Budget roughly 1 GB of RAM for this container.
  browserless:
    image: ghcr.io/browserless/chromium:v2.55.3
    environment:
      TOKEN: ${BROWSER_TOKEN}
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-3}
      QUEUED: ${BROWSERLESS_QUEUED:-6}
      TIMEOUT: ${BROWSERLESS_TIMEOUT:-60000}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null "http://localhost:3000/pressure?token=$$TOKEN" || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Scraper gateway. Renders pages the app's plain fetch can't (client-side
  # rendering, interstitials). The app reaches it at http://scraper:8080 via
  # SCRAPER_URL and seeds a "GiftWrapt Scraper" provider entry on first boot;
  # after that, manage it under Admin > Scraping.
  scraper:
    image: ${SCRAPER_IMAGE:-ghcr.io/shawnphoffman/giftwrapt-scraper:latest}
    depends_on:
      browserless:
        condition: service_healthy
    environment:
      BROWSERLESS_URL: http://browserless:3000
      # BROWSER_TOKEN is the secret shared with the headless engine above.
      # BROWSER_TOKENS is the list of tokens the gateway accepts from
      # callers; a single-token deployment reuses the same value.
      BROWSER_TOKEN: ${BROWSER_TOKEN}
      BROWSER_TOKENS: ${BROWSER_TOKENS:-${BROWSER_TOKEN}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-5242880}
      PER_HOST_CONCURRENCY: ${PER_HOST_CONCURRENCY:-2}
      RESPECT_ROBOTS: ${RESPECT_ROBOTS:-0}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      # RustFS provisions root credentials at startup from these. Plumb the
      # same STORAGE_* values through so the app and the bucket share one
      # identity. RustFS accepts arbitrary strings - no format constraints.
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    # Intentionally no host port: RustFS is only reachable on the compose
    # network. The app serves images via /api/files/* so clients never need
    # direct bucket access. To expose direct S3 URLs (faster, offloads
    # bandwidth), add a reverse-proxy rule for 9000 and set
    # STORAGE_PUBLIC_URL in .env. To expose the web console, add 9001.
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
